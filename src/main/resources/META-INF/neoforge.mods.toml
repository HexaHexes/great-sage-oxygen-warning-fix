[[mods]]
modId = "gsoxygenfix"
version = "1.0.0"
displayName = "Great Sage Oxygen Tip Fix"
description = '''
Stops the Great Sage low-oxygen warning (SANSO_KINSHOU) from firing
while the air supply is 0 or negative - Dragon Survival's unlimited
oxygen marker for water-breathing dragon species (sea dragon and sea
dragonborn). Positive-but-low air still triggers the warning normally.
'''

[[mixins]]
config = "gsoxygenfix.mixins.json"

