[[mods]]
modId = "gsoxygenfix"
version = "1.0.0"
displayName = "Great Sage Oxygen Tip Fix"
description = '''
Stops the Great Sage low-oxygen warning (SANSO_KINSHOU) from firing
while Dragon Survival is withholding oxygen for a water-breathing
species in its swim form. Positive-but-low air, and genuine drowning
in a player with no water-breathing ability, still trigger the
warning normally.
'''

[[mixins]]
config = "gsoxygenfix.mixins.json"

[[dependencies.gsoxygenfix]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.gsoxygenfix]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.21.2)"
ordering = "NONE"
side = "BOTH"

[[dependencies.gsoxygenfix]]
modId = "greatsage"
type = "required"
versionRange = "[0.0.6,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.gsoxygenfix]]
modId = "dragonsurvival"
type = "required"
versionRange = "[2.0.71,)"
ordering = "NONE"
side = "BOTH"
