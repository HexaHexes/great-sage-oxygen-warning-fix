plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '1.0.0'
group = 'dev.kurok.mods'

base {
    archivesName = 'gsoxygenfix'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = '21.1.259'

    mods {
        gsoxygenfix {
            sourceSet sourceSets.main
        }
    }
}
