plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = 'org.bitwisemadness'

base {
    archivesName = 'gsoxygenfix'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = '21.1.259'

    mods {
        gsoxygenfix {
            sourceSet sourceSets.main
        }
    }
}

// Compile-only: Dragon Survival provides SwimData / UNLIMITED_OXYGEN, which the
// redirect reads at compile time. The jar is staged in the gitignored libs/
// folder (never committed) and is present at runtime as a required dependency.
dependencies {
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
}
